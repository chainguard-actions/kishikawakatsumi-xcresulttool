name: Test with show-passed-tests and show-code-coverage disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake xcresult directory
        run: |
          mkdir -p /tmp/test-options.xcresult
          echo '{}' > /tmp/test-options.xcresult/Info.plist
      - id: action
        uses: .
        with:
          path: /tmp/test-options.xcresult
          token: fake-token-for-testing
          title: 'Custom Title'
          show-passed-tests: 'false'
          show-code-coverage: 'false'
          upload-bundles: 'false'
        continue-on-error: true
      - name: Assert action ran with custom options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail because the xcresult bundle is fake
          # and the token is not valid, but it should not crash unexpectedly.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
