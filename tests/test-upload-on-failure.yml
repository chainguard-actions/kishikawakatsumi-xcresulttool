name: Test upload-bundles failure option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /tmp/nonexistent.xcresult
          token: ''
          title: 'Upload On Failure Test'
          show-passed-tests: 'true'
          show-code-coverage: 'true'
          upload-bundles: 'failure'
      - name: Assert action failed gracefully with upload-bundles=failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when xcresult path does not exist, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with upload-bundles=failure when xcresult bundle was not found"
