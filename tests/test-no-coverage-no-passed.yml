name: Test with show-passed-tests and show-code-coverage disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with coverage and passed tests disabled
        id: action
        uses: .
        with:
          path: /tmp/nonexistent.xcresult
          token: ${{ github.token }}
          title: 'Test Results - No Coverage'
          show-passed-tests: 'false'
          show-code-coverage: 'false'
          upload-bundles: 'false'
        continue-on-error: true

      - name: Assert action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with non-existent xcresult path, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (xcrun not available on Linux)"
