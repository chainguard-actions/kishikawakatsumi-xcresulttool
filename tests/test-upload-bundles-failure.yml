name: Test upload-bundles failure option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: /nonexistent/path/to/Test.xcresult
          token: ''
          upload-bundles: failure
      - name: Assert action failed gracefully with upload-bundles=failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when xcresult path does not exist, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with upload-bundles=failure input"
