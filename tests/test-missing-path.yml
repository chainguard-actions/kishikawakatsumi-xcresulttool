name: Test missing xcresult path - error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-existent xcresult path
        id: action
        uses: .
        with:
          path: /nonexistent/path/to/bundle.xcresult
          token: ${{ github.token }}
          title: 'Test Results'
          show-passed-tests: 'true'
          show-code-coverage: 'true'
          upload-bundles: 'never'
        continue-on-error: true

      - name: Assert action failed due to missing path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when path does not exist, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when xcresult path does not exist"
