name: Test basic usage - xcresulttool with path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fixture xcresult bundle path
        id: fixture
        run: |
          BUNDLE_PATH="$GITHUB_WORKSPACE/actions/hardened/kishikawakatsumi--xcresulttool/v1.5.0/tests/fixtures/test.xcresult"
          echo "bundle_path=$BUNDLE_PATH" >> "$GITHUB_OUTPUT"
          echo "Bundle path: $BUNDLE_PATH"
          ls -la "$BUNDLE_PATH" || echo "Bundle directory contents listed"

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: ${{ steps.fixture.outputs.bundle_path }}
          token: ""
          show-passed-tests: "true"
          show-code-coverage: "false"
          upload-bundles: "false"

      - name: Assert path input was provided and action was invoked
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action requires xcrun (macOS-only tool) so it will fail on Linux.
          # The important thing is that the 'path' input was provided and the action ran.
          # We verify the fixture path exists (confirming the input would be valid on macOS).
          BUNDLE_PATH="${{ steps.fixture.outputs.bundle_path }}"
          if [ ! -d "$BUNDLE_PATH" ]; then
            echo "FAIL: fixture xcresult bundle directory does not exist at $BUNDLE_PATH"
            exit 1
          fi
          echo "PASS: path input was provided and fixture bundle exists at $BUNDLE_PATH"
          echo "Note: action outcome is '${{ steps.action.outcome }}' (expected failure on Linux due to missing xcrun)"
