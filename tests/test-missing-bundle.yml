name: Test missing xcresult bundle
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test action fails with missing bundle
        id: action
        uses: .
        with:
          path: /nonexistent/path/to/bundle.xcresult
          token: fake-token
          title: 'Test Results'
          show-passed-tests: 'true'
          show-code-coverage: 'true'
          upload-bundles: 'false'
        continue-on-error: true
      - name: Assert action failed due to missing bundle
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when bundle path does not exist, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for missing xcresult bundle"
